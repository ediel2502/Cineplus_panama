name: Build CinePlus APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify web app and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get project
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify required app sections and playback handlers
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'id="catalogo"', 'id="iptv-playlist"', 'id="tv-en-vivo"',
            'id="filmGrid"', 'id="m3uGrid"', 'id="video"',
            'function parseM3u(', 'function playTitle(', 'id="demoLive"'
          ];
          const missing = required.filter(item => !html.includes(item));
          if (missing.length) {
            console.error('Missing app requirements:', missing.join(', '));
            process.exit(1);
          }
          if (!html.includes('</html>') || !html.includes('</script>')) {
            console.error('HTML document or script appears incomplete');
            process.exit(1);
          }
          console.log('Required catalog, IPTV, live TV and playback hooks found.');
          const vm = require('vm');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]
            .map(match => match[1].trim()).filter(Boolean);
          if (!scripts.length) {
            console.error('No inline JavaScript found to validate');
            process.exit(1);
          }
          for (let i = 0; i < scripts.length; i++) {
            try {
              new vm.Script(scripts[i], { filename: `index-inline-${i + 1}.js` });
            } catch (error) {
              console.error('JavaScript syntax error:', error.message);
              process.exit(1);
            }
          }
          console.log(`Validated syntax for ${scripts.length} inline JavaScript block(s).`);
          NODE
      - name: Prepare web app
        run: |
          npm run build
          test -s www/index.html
          npm install @capacitor/core@^7 @capacitor/android@^7
          npm install --save-dev @capacitor/cli@^7
          npx cap add android
          npx cap sync android
      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CinePlus-Panama-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
